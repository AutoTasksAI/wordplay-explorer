<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO -->
  <title>Read with Rex — Free Reading Games for Kids Ages 4-6</title>
  <meta
    name="description"
    content="Free reading games for kids ages 4–6. Read with Rex turns first sight words, numbers, and patterns into a dinosaur-sized adventure. Everything is spoken aloud — no ads, no timers, no pressure."
  />
  <meta
    name="keywords"
    content="reading games for kids, free reading games, learn to read for kids, sight words for 5 year olds, first words for kids, reading games for kindergarten"
  />
  <link rel="canonical" href="https://readwithrex.com/" />

  <!-- Open Graph / social previews -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Read with Rex" />
  <meta property="og:title" content="Read with Rex — Free Reading Games for Kids Ages 4-6" />
  <meta
    property="og:description"
    content="Free reading games for kids ages 4–6. First sight words, numbers, and patterns — spoken aloud by Rex the T-Rex. No ads, no timers."
  />
  <meta property="og:url" content="https://readwithrex.com/" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Read with Rex — Free Reading Games for Kids Ages 4-6" />
  <meta
    name="twitter:description"
    content="Free reading games for kids ages 4–6: first sight words, numbers, and patterns, spoken aloud. No ads, no timers."
  />

  <meta name="theme-color" content="#fff8e7" />

  <!-- Structured data: app + learning resource + FAQ (matches the on-page FAQ) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebApplication",
          "name": "Read with Rex",
          "url": "https://readwithrex.com/",
          "applicationCategory": "EducationalApplication",
          "operatingSystem": "Web",
          "browserRequirements": "Requires JavaScript",
          "inLanguage": "en",
          "description": "Free reading games for kids ages 4-6 that turn first sight words, numbers, and patterns into a dinosaur adventure. Everything is spoken aloud by Rex the T-Rex.",
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
          "audience": {
            "@type": "EducationalAudience",
            "educationalRole": "student",
            "audienceType": "children ages 4 to 6"
          }
        },
        {
          "@type": "LearningResource",
          "name": "Read with Rex — First Words Reading Games",
          "url": "https://readwithrex.com/",
          "description": "Beginning-reader games for preschool and kindergarten: recognizing first sight words, counting 1-10, and completing simple patterns, with spoken prompts and star rewards.",
          "learningResourceType": ["game", "activity"],
          "educationalLevel": ["preschool", "kindergarten"],
          "teaches": ["first sight words", "word recognition", "counting 1 to 10", "pattern recognition"],
          "audience": { "@type": "EducationalAudience", "educationalRole": "student", "audienceType": "ages 4 to 6" },
          "educationalUse": "practice",
          "inLanguage": "en"
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What age is Read with Rex for?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Read with Rex is made for children ages 4 to 6 — preschool through kindergarten — who are just starting to learn to read. The first games focus on recognizing first sight words like cat, dog, and sun, plus counting 1-10 and simple patterns."
              }
            },
            {
              "@type": "Question",
              "name": "Is Read with Rex really free?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. The reading games are completely free — no paywalls, no subscriptions, and no ads. Your child can start playing in one tap with guest mode."
              }
            },
            {
              "@type": "Question",
              "name": "What will my child learn first?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Children start by recognizing their first words (cat, dog, sun, hat, bus...), then mix in counting 1-10 and completing simple color patterns. Every word, number, and prompt is spoken out loud."
              }
            },
            {
              "@type": "Question",
              "name": "Can my 4- or 5-year-old play alone?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Rex the T-Rex speaks every prompt aloud, so no reading is required to start. There are no timers, no streaks, and no losing — just gentle try-again and a star for every win."
              }
            },
            {
              "@type": "Question",
              "name": "Do you collect data from my child?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. There are no ads and no tracking, and children are never asked for personal information. Guest mode means no account and no email — just play."
              }
            },
            {
              "@type": "Question",
              "name": "Do reading games actually help kids learn to read?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes, when they repeat the right things. Read with Rex brings missed words back more often and schedules known ones for later review, so children get the repetition that helps sight words stick — wrapped in a game they want to play."
              }
            }
          ]
        }
      ]
    }
  </script>

  <!-- Plausible — privacy-first, cookie-free analytics (parent-facing pages only).
       Create the site in Plausible with domain readwithrex.com to activate. -->
  <script
    defer
    data-domain="readwithrex.com"
    src="https://plausible.io/js/script.js"
  ></script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
